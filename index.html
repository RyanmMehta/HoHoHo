<script type="module">
import {renderPlaces} from "/places.js";
import {renderHangouts} from "/calendar.js";
const gift=document.querySelector('.gift'),replay=document.querySelector('.replay'),reveal=document.querySelector('.reveal');let opening=false;const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
for(let i=0;i<8;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%3?'✦':'✧';const a=i/8*Math.PI*2;s.style.setProperty('--x',`${Math.cos(a)*(90+i%4*24)}px`);s.style.setProperty('--y',`${Math.sin(a)*110-70}px`);document.querySelector('.burst').append(s)}
gift.addEventListener('click',()=>{if(opening)return;opening=true;gift.disabled=true;document.body.classList.add('opening');setTimeout(()=>{document.body.classList.add('opened');reveal.setAttribute('aria-hidden','false');document.querySelector('main').inert=true;document.querySelector('.menu-row').focus({preventScroll:true})},reduced.matches?100:2900)});
replay.addEventListener('click',()=>{document.body.classList.remove('opened','opening');reveal.setAttribute('aria-hidden','true');document.querySelector('main').inert=false;gift.disabled=false;opening=false;gift.focus({preventScroll:true})});

const destination=document.querySelector('.destination'), heading=destination.querySelector('h1');let travelling=false;let selectedRow=null;
async function travel(row){
 if(travelling)return;if(!nameConfirmed){selectedRow=row;destination.classList.add('active','party');destination.setAttribute('aria-hidden','false');reveal.inert=true;renderName(()=>{destination.classList.remove('active');destination.setAttribute('aria-hidden','true');reveal.inert=false;travel(row)});return}travelling=true;selectedRow=row;
 const deer=row.querySelector('.deer'),note=row.querySelector('.note');
 reveal.classList.add('departing');row.classList.add('running');reveal.inert=true;
 const distance=window.innerWidth-row.getBoundingClientRect().left+80;
 const options={duration:reduced.matches?1:1800,easing:'cubic-bezier(.32,0,.67,1)',fill:'forwards'};
 // Keep the text and deer in the same moving row, preserving their physical gap.
 const motion=row.animate([{transform:'translateX(0)'},{transform:`translateX(${distance}px)`}],options);
 await motion.finished;
 if(row.dataset.page==='party-plans')calendarMonth=10;renderPage(row.dataset.page);destination.classList.add('active');destination.setAttribute('aria-hidden','false');reveal.setAttribute('aria-hidden','true');
 history.pushState({page:row.dataset.page},'',`#${row.dataset.page}`);destination.querySelector('h1').focus({preventScroll:true});
 row.style.visibility='hidden';motion.cancel();row.classList.remove('running');travelling=false;
}
document.querySelectorAll('.menu-row:not(:disabled)').forEach(row=>row.addEventListener('click',()=>travel(row)));
function returnToMenu(){if(selectedRow)selectedRow.style.visibility='';destination.classList.remove('active');destination.setAttribute('aria-hidden','true');reveal.classList.remove('departing');reveal.setAttribute('aria-hidden','false');reveal.inert=false;if(selectedRow)selectedRow.focus({preventScroll:true});}
document.querySelector('.back-menu').addEventListener('click',()=>{returnToMenu();history.replaceState(null,'',location.pathname+location.search)});
window.addEventListener('popstate',()=>{if(['#party-plans','#places-to-go'].includes(location.hash)){renderPage(location.hash.slice(1))}else{returnToMenu()}});

const selectedDates=new Set();let calendarMonth=10;let nameConfirmed=false;let guestName='';try{guestName=localStorage.getItem('hohoho-guest-name')||''}catch{}
const storageKey='hohoho-availability-nov-dec-2026';
const dateKey=(month,day)=>`2026-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
const parseDate=key=>{const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d)};
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))saved.forEach(key=>{if(typeof key==='string'&&/^2026-(11|12)-\d{2}$/.test(key)){const date=parseDate(key);if(dateKey(date.getMonth(),date.getDate())===key&&[0,4,5,6].includes(date.getDay()))selectedDates.add(key)}});const old=JSON.parse(localStorage.getItem('hohoho-availability-2026')||'[]');if(!localStorage.getItem(storageKey)&&Array.isArray(old))old.forEach(d=>{if(Number.isInteger(d)&&d>=1&&d<=31&&[0,4,5,6].includes(new Date(2026,11,d).getDay()))selectedDates.add(dateKey(11,d))})}catch{}
const content=destination.querySelector('.destination-content');
function renderPage(page){
 destination.classList.add('party');destination.classList.toggle('places-page',page==='places-to-go');
 if(!nameConfirmed){renderName(()=>renderPage(page));return}
 if(page==='places-to-go'){renderPlaces(content,{name:guestName,changeName:()=>renderName(()=>renderPage(page))});return}
 const november=calendarMonth===10,month=november?'November':'December';
 content.innerHTML=`<button class="change-name edit-dates">Change name</button><div class="calendar-eyebrow">LET’S MAKE MERRY · ${november?'1':'2'} OF 2</div><h1 tabindex="-1">Click the days you are available</h1><p class="privacy-note">7 p.m.–midnight · New York time · ends the following day</p><a class="calendar-link" href="https://calendar.google.com/calendar/u/0/r/month/2026/${calendarMonth+1}/1" target="_blank" rel="noopener noreferrer">Check your Google Calendar here ↗</a><div class="calendar-card"><div class="month-title"><h2>${month} 2026</h2><span>’tis the season <b class="holly" aria-hidden="true">✦</b></span></div><div class="calendar-grid" role="group" aria-label="${month} 2026 availability"></div><div class="calendar-key">Thursday–Sunday · pick all the days that work</div></div><p class="calendar-status" aria-live="polite"></p><button class="continue">${november?'Next to December →':'Submit availability →'}</button>${november?'':'<button class="previous-month edit-dates">← back to November</button>'}<button class="clear-dates edit-dates">Clear ${month} selection</button><p class="privacy-note">Your name and selected evenings will be sent privately to Ryan when you submit.</p><section class="announced-hangouts"><h2>Upcoming hangouts</h2><div class="hangout-list"></div></section>`;
 renderHangouts(content.querySelector('.hangout-list'));
 content.querySelector('.change-name').addEventListener('click',()=>renderName(()=>renderPage('party-plans')));
 content.querySelector('.clear-dates').addEventListener('click',()=>{for(const key of selectedDates)if(parseDate(key).getMonth()===calendarMonth)selectedDates.delete(key);saveDates();renderPage('party-plans')});
 const grid=content.querySelector('.calendar-grid');
 ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((day,i)=>{const label=document.createElement('div');label.className='weekday'+(i>=3?' marked':'');label.textContent=day;grid.append(label)});
 const offset=(new Date(2026,calendarMonth,1).getDay()+6)%7;
 for(let i=0;i<offset;i++){const blank=document.createElement('span');blank.setAttribute('aria-hidden','true');grid.append(blank)}
 const days=new Date(2026,calendarMonth+1,0).getDate();
 for(let d=1;d<=days;d++){const date=new Date(2026,calendarMonth,d),key=dateKey(calendarMonth,d),available=[0,4,5,6].includes(date.getDay()),button=document.createElement('button');button.className='day'+(calendarMonth===11&&d===25?' christmas':'');button.textContent=d;button.disabled=!available;button.setAttribute('aria-label',date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+(available?'':' — not a party day'));if(available){button.setAttribute('aria-pressed',String(selectedDates.has(key)));button.addEventListener('click',()=>{if(selectedDates.has(key))selectedDates.delete(key);else selectedDates.add(key);button.setAttribute('aria-pressed',String(selectedDates.has(key)));updateSelection()})}grid.append(button)}
 content.querySelector('.continue').addEventListener('click',()=>{if(november){saveDates();calendarMonth=11;renderPage('party-plans');destination.scrollTop=0;content.querySelector('h1').focus({preventScroll:true})}else if(selectedDates.size){submitAvailability()}});
 content.querySelector('.previous-month')?.addEventListener('click',()=>{calendarMonth=10;renderPage('party-plans');destination.scrollTop=0});updateSelection();
}
function renderName(onDone=()=>renderPage('party-plans')){
 destination.classList.remove('places-page');
 content.innerHTML='<form class="name-form"><div class="calendar-eyebrow">A SEAT AT THE TABLE</div><h1 tabindex="-1">First, what’s your name?</h1><p>One name for all your holiday plans.</p><label for="guest-name">Your name</label><input id="guest-name" name="name" autocomplete="name" required maxlength="80" placeholder="Your first and last name"><p class="name-error" role="alert"></p><button class="continue" type="submit">Save my name & continue →</button><p class="privacy-note">Ryan will see your name, availability and activity choices. Your name is remembered in this browser. Changing it updates this browser’s existing responses.</p></form>';
 const input=content.querySelector('input');input.value=guestName;destination.scrollTop=0;input.focus({preventScroll:true});
 content.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();const value=input.value.trim().replace(/\s+/g,' '),error=content.querySelector('.name-error'),button=content.querySelector('.continue');if(!value){error.textContent='Please enter your name.';input.focus();return}button.disabled=true;button.textContent='Saving…';error.textContent='';try{const response=await fetch('/api/guest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to save your name.');guestName=result.name;nameConfirmed=true;try{localStorage.setItem('hohoho-guest-name',guestName)}catch{}onDone();destination.scrollTop=0;content.querySelector('h1')?.focus({preventScroll:true})}catch(e){error.textContent='Could not save your name. '+(e.message==='Failed to fetch'?'Please check your connection and try again.':e.message);button.disabled=false;button.textContent='Save my name & continue →'}});
}
function saveDates(){try{localStorage.setItem(storageKey,JSON.stringify([...selectedDates]));return true}catch{return false}}
function updateSelection(){const count=selectedDates.size,monthCount=[...selectedDates].filter(key=>parseDate(key).getMonth()===calendarMonth).length;content.querySelector('.calendar-status').textContent=`${monthCount} ${monthCount===1?'day':'days'} selected this month · ${count} total`;content.querySelector('.continue').disabled=calendarMonth===11&&!count}
async function submitAvailability(){
 const button=content.querySelector('.continue'),status=content.querySelector('.calendar-status');button.disabled=true;button.textContent='Sending…';
 try{const response=await fetch('/api/responses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:guestName,dates:[...selectedDates].sort()})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to submit.');saveDates();showNext(true)}catch(error){status.textContent=error.message==='Failed to fetch'?'Could not connect. Your dates are still here—please try again.':error.message;button.disabled=false;button.textContent='Try submitting again →'}
}
function showNext(stored){content.innerHTML=`<div class="saved-panel"><span class="tiny-star" aria-hidden="true">✧</span><h1 tabindex="-1">A little closer to Christmas.</h1><p class="guest-summary"></p><div class="chosen-dates"></div><p class="privacy-note">Your availability has been sent privately to Ryan. You can update it from this browser.</p><button class="edit-dates">← change my days</button><h2>Upcoming hangouts</h2><div class="hangout-list"></div></div>`;content.querySelector('.guest-summary').textContent=guestName+'’s available evenings · 7 p.m.–midnight (New York)';const dates=content.querySelector('.chosen-dates');[...selectedDates].sort().forEach(key=>{const chip=document.createElement('span');chip.textContent=parseDate(key).toLocaleDateString('en-US',{month:'short',day:'numeric'});dates.append(chip)});renderHangouts(content.querySelector('.hangout-list'));content.querySelector('.edit-dates').addEventListener('click',()=>{calendarMonth=10;renderPage('party-plans')});content.querySelector('h1').focus({preventScroll:true});destination.scrollTop=0}
if(['#party-plans','#places-to-go'].includes(location.hash)){document.body.classList.add('opened');document.querySelector('main').inert=true;reveal.inert=true;renderPage(location.hash.slice(1));destination.classList.add('active');destination.setAttribute('aria-hidden','false')}
</script>
